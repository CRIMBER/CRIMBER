
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIMBER — Living Ink</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --ink: #100e0d;
    --cream: #e9dccb;
    --amber: #c68b5b;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--cream);
    font-family: Georgia, serif;
  }

  #world {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  .atmosphere {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 40%,
        transparent 5%, rgba(16,14,13,.18) 65%),
      linear-gradient(180deg,
        rgba(16,14,13,.12),
        rgba(16,14,13,.35));
  }

  main {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 20px;
  }

  .identity {
    width: min(720px, 100%);
    text-align: center;
    padding: 64px 20px;
  }

  .eyebrow {
    color: #bda58f;
    font: 11px/1.8 monospace;
    letter-spacing: .3em;
    text-transform: uppercase;
  }

  h1 {
    margin: 24px 0 12px;
    font-size: clamp(56px, 12vw, 112px);
    font-weight: 400;
    letter-spacing: .14em;
    line-height: 1;
    background: linear-gradient(
      110deg, #f2e3d0, #b98a67, #e7d7c6, #a9b5b1
    );
    background-size: 240% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    animation: inkShimmer 12s ease-in-out infinite alternate;
  }

  .subtitle {
    color: #c6b6a7;
    font: 12px monospace;
    letter-spacing: .16em;
  }

  .rule {
    width: 100px;
    height: 1px;
    margin: 32px auto;
    background: linear-gradient(
      90deg, #9b5d47, #d7b08a, #7e8e93
    );
    box-shadow: 0 0 14px #b17c5640;
  }

  .description {
    color: #d3c6b8;
    font-size: clamp(15px, 2.5vw, 18px);
    line-height: 1.9;
    max-width: 470px;
    margin: auto;
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 24px;
    margin-top: 36px;
  }

  a {
    color: #d7b08a;
    text-decoration: none;
    font: 12px monospace;
    letter-spacing: .08em;
    transition: color .3s, text-shadow .3s;
  }

  a:hover {
    color: #f2e3d0;
    text-shadow: 0 0 18px #d7b08a70;
  }

  @keyframes inkShimmer {
    from { background-position: 0% 50%; }
    to   { background-position: 100% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    h1 { animation: none; }
  }
</style>
</head>

<body>
<canvas id="world" aria-hidden="true"></canvas>
<div class="atmosphere"></div>

<main>
  <section class="identity">
    <div class="eyebrow">Mohamed Taufiq · CSE / AI & ML</div>

    <h1>CRIMBER</h1>

    <div class="subtitle">
      SOFTWARE · AI / ML · UNITY / XR · RESEARCH
    </div>

    <div class="rule"></div>

    <p class="description">
      Different disciplines, one creative mind.
      Building things, exploring ideas, and seeing
      where curiosity leads.
    </p>

    <nav class="links">
      <a href="https://github.com/CRIMBER">GITHUB ↗</a>
      <a href="https://www.linkedin.com/">LINKEDIN ↗</a>
    </nav>
  </section>
</main>

<script>
(() => {
  const canvas = document.querySelector("#world");
  const ctx = canvas.getContext("2d");
  const reducedMotion =
    matchMedia("(prefers-reduced-motion: reduce)").matches;

  let w, h, dpr, particles = [], frame = 0;

  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth;
    h = innerHeight;

    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.min(100, Math.floor(w * h / 14000));

    particles = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.5 + .3,
      speed: Math.random() * .22 + .05,
      phase: Math.random() * Math.PI * 2,
      tint: Math.random()
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);

    // Soft, slowly shifting pools of coloured light
    const t = frame * .003;

    const glow = ctx.createRadialGradient(
      w * (.5 + Math.sin(t) * .18),
      h * (.42 + Math.cos(t * .7) * .15),
      0, w * .5, h * .5, Math.max(w, h) * .8
    );

    glow.addColorStop(0, "#79503920");
    glow.addColorStop(.45, "#34464a0c");
    glow.addColorStop(1, "#100e0d00");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);

    // Delicate flowing ink contours
    for (let layer = 0; layer < 5; layer++) {
      ctx.beginPath();

      for (let x = -10; x <= w + 10; x += 8) {
        const y =
          h * (.25 + layer * .13) +
          Math.sin(x * .003 + t + layer) * 32 +
          Math.sin(x * .008 - t * .6 + layer) * 9;

        if (x === -10) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.strokeStyle = [
        "#bd82501a", "#9c68451b",
        "#758f9010", "#a96c5014", "#77649a0d"
      ][layer];

      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // Tiny drifting particles
    for (const p of particles) {
      p.y -= reducedMotion ? 0 : p.speed;
      p.x += reducedMotion ? 0 : Math.sin(frame * .008 + p.phase) * .12;

      if (p.y < -4) {
        p.y = h + 4;
        p.x = Math.random() * w;
      }

      const colour = p.tint > .8
        ? "202,155,113"
        : p.tint > .5
        ? "127,151,155"
        : "218,200,178";

      const alpha = .15 + (Math.sin(frame * .025 + p.phase) + 1) * .13;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${colour},${alpha})`;
      ctx.fill();
    }

    if (!reducedMotion) frame++;
    if (!reducedMotion) requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  resize();
  draw();
})();
</script>
</body>
</html>
